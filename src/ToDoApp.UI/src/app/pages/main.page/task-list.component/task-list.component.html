<div class="flex max-h-full flex-col gap-y-2 p-2">

  <!-- Filters -->

  <div class="flex flex-col gap-2">

    <!-- Search -->

    <div class="flex items-center rounded-xl border border-gray-300 bg-white px-3 py-2
                focus-within:border-blue-500 focus-within:ring-2 focus-within:ring-blue-500/20">

      <span class="mr-2 text-gray-400">
        🔍
      </span>

      <input type="text"
             [ngModel]="search()"
             (ngModelChange)="onSearchChange($event)"
             placeholder="Search tasks..."
             class="min-w-0 flex-1 bg-transparent outline-none" />

      @if (search()) {

      <button type="button"
              (click)="onSearchChange('')"
              class="rounded-md p-1 text-gray-400 transition hover:bg-gray-100 hover:text-gray-600"
              title="Clear">

        ✕

      </button>

      }

    </div>

    <!-- Done filter -->

    <div class="flex gap-1 rounded-xl bg-gray-100 p-1">

      <button type="button"
              (click)="setDone(undefined)"
              class="flex-1 rounded-lg px-3 py-2 text-sm font-medium transition"
              [class.bg-white]="selectedDone() === undefined"
              [class.shadow-sm]="selectedDone() === undefined"
              [class.text-gray-800]="selectedDone() === undefined"
              [class.text-gray-500]="selectedDone() !== undefined">

        All

      </button>

      <button type="button"
              (click)="setDone(false)"
              class="flex-1 rounded-lg px-3 py-2 text-sm font-medium transition"
              [class.bg-white]="selectedDone() === false"
              [class.shadow-sm]="selectedDone() === false"
              [class.text-gray-800]="selectedDone() === false"
              [class.text-gray-500]="selectedDone() !== false">

        Active

      </button>

      <button type="button"
              (click)="setDone(true)"
              class="flex-1 rounded-lg px-3 py-2 text-sm font-medium transition"
              [class.bg-white]="selectedDone() === true"
              [class.shadow-sm]="selectedDone() === true"
              [class.text-gray-800]="selectedDone() === true"
              [class.text-gray-500]="selectedDone() !== true">

        Completed

      </button>

    </div>

    <!-- Category -->

    <select [value]="taskStore.category() ?? ''"
            (change)="selectCategory(($any($event.target)).value || undefined)"
            class="w-full rounded-xl border border-gray-300 bg-white px-3 py-2 transition outline-none
                   focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">

      <option value="">
        All categories
      </option>

      @for (category of categories(); track category.id) {

      <option [value]="category.name">
        {{ category.name }}
      </option>

      }

      <option value="reserved-option-none">
        No categories
      </option>

    </select>

  </div>

  <!-- Add -->

  <button type="button"
          (click)="addTask()"
          class="w-full rounded-xl bg-blue-600 px-4 py-2 font-medium text-white transition hover:bg-blue-700">

    + Add Task

  </button>

  <!-- Tasks -->

<div class="hide-scrollbar flex min-h-0 flex-1 flex-col gap-y-2 overflow-y-auto py-2">

  @if (loading()) {

    <div class="flex items-center justify-center py-8 text-gray-500">
      Loading...
    </div>

  }
  @else if (tasks().length === 0) {

    <div class="flex items-center justify-center py-8 text-gray-500">
      No tasks found.
    </div>

  }
  @else {

    @for (task of tasks(); track task.id)
    {
      <app-task-list-item
        [task]="task"
        [categories]="categories()"
        (toggleDone)="saveTask($event)"
        (deleteTask)="deleteTask($event)"
        (editTask)="editTask($event)" />
    }

  }

</div>

  <!-- Pagination -->

  <app-task-list-pagination [page]="taskStore.page()"
                            [totalPages]="taskStore.totalPages()"
                            [hasPreviousPage]="taskStore.hasPreviousPage()"
                            [hasNextPage]="taskStore.hasNextPage()"
                            [loading]="loading()"
                            (previous)="taskStore.previousPage()"
                            (next)="taskStore.nextPage()" />

  <!-- Task form -->
  @if (showTaskForm())
  {

  <app-task-list-item-form [task]="editingTask()"
                           [categories]="categories()"
                           (saveTask)="saveTask($event)"
                           (close)="closeTaskForm()" />

  }

</div>
